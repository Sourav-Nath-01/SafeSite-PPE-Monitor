name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The compliance logic, settings validation and database layer import no
      # torch, OpenCV or numpy by design, so the suite runs on a bare
      # interpreter in seconds - no weights, GPU or camera.
      - name: Run compliance test suite
        run: ./run_tests.sh

  # The same suite against the backends the Azure deployment uses: every
  # database case on PostgreSQL 16, every snapshot-store case on the Azurite
  # Blob emulator. Fails if any of those cases were skipped.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: safesite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Started by hand rather than as a service so it can skip the API version
      # check: the SDK can be newer than the emulator.
      - name: Start Azurite (Blob emulator)
        run: |
          docker run -d -p 10000:10000 mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0
            sleep 1
          done
          exit 1

      - name: Install database and storage drivers
        run: pip install "psycopg[binary]>=3.2" "psycopg-pool>=3.2" "azure-storage-blob>=12.20"

      - name: Run suite against PostgreSQL and Azurite
        shell: bash
        env:
          PPE_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/safesite_test
          PPE_TEST_AZURITE_BLOB_URL: http://127.0.0.1:10000/devstoreaccount1
        run: |
          ./run_tests.sh 2>&1 | tee test.log
          if grep -q "skipped 'set PPE_TEST" test.log; then
            echo "::error::integration cases were skipped"
            exit 1
          fi

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compiles and lints the Bicep template (no Azure login needed), so a
      # broken template fails here rather than halfway through a deploy.
      - name: Build Bicep template
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: Build Bicep module
        run: az bicep build --file infra/modules/postgres-admin.bicep --stdout > /dev/null

      - name: Check shell scripts
        run: bash -n infra/bootstrap.sh run_tests.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Same image the deploy workflow ships, so a broken Dockerfile fails a
      # pull request rather than a release. The cache is shared with deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: safesite:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it the way Container Apps will (gunicorn, public-demo mode) and
      # push one real image through the model.
      - name: Smoke test the container
        run: |
          docker run -d --name safesite -p 3333:3333 -e PPE_PUBLIC_DEMO=true safesite:ci
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3333/healthz; then
              echo
              curl -fsS -F image=@Model-Training/Outputs/runs/detect/yolov8s_ppe_css_200_epochs/val_batch0_labels.jpg \
                http://127.0.0.1:3333/api/detect | python3 -c "import json, sys; d = json.load(sys.stdin); assert d['status'] == 'success', d; print('detect OK:', d['update']['detection_details']['person_count'], 'workers,', d['update']['inference_ms'], 'ms')"
              exit 0
            fi
            sleep 2
          done
          docker logs safesite
          exit 1
